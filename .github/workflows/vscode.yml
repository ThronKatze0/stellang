name: vscode extension
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["editors/vscode/**", "src/**", "std/**", ".github/workflows/vscode.yml"]
  pull_request:
    paths: ["editors/vscode/**", "src/**", "std/**", ".github/workflows/vscode.yml"]
  workflow_dispatch:

jobs:
  # every editor feature, checked inside a real VS Code
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang libgc-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: editors/vscode
        run: npm ci && npm run bundle && xvfb-run -a npm test

  # one .vsix per platform, with the compiler inside, so installing it is all you need
  package:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: editors/vscode
        run: |
          npm ci
          npm run bundle
          npx vsce package --target ${{ matrix.target }} --out stellang-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: stellang-${{ matrix.target }}
          path: editors/vscode/stellang-${{ matrix.target }}.vsix

  # and one without a compiler, for any platform (it uses `stellang` from PATH)
  universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: editors/vscode
        run: npm ci && npm run package:nobin
      - uses: actions/upload-artifact@v4
        with:
          name: stellang-universal
          path: editors/vscode/stellang-universal.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, universal]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: vsix, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" vsix/*.vsix --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

  # needs repository secrets: VSCE_PAT (VS Code Marketplace) and/or OVSX_PAT (Open VSX); see editors/vscode/PUBLISHING.md
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: vsix, merge-multiple: true }
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./editors/vscode/package.json').version")
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "::error::tag ${{ github.ref_name }} but package.json says $v"; exit 1; }
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::no VSCE_PAT secret: skipped the VS Code Marketplace"; exit 0; fi
          npx --yes @vscode/vsce@3.2.1 publish --packagePath vsix/*.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::no OVSX_PAT secret: skipped Open VSX"; exit 0; fi
          npx --yes ovsx@0.10.1 publish --packagePath vsix/*.vsix -p "$OVSX_PAT"
